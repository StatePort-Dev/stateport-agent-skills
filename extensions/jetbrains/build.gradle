import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'dev.stateport'
version = '0.1.0-alpha.7'

repositories {
    mavenCentral()
    intellijPlatform { defaultRepositories() }
}

dependencies {
    intellijPlatform { intellijIdea('2026.1.3') }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

tasks.named('processResources') {
    from('../../LICENSE') { into 'META-INF' }
}

sourceSets {
    verification {
        java.srcDir 'src/verification/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '261'
            untilBuild = '262.*'
        }
    }
    pluginVerification {
        ides {
            create IntelliJPlatformType.IntellijIdea, '2026.1.3'
            create IntelliJPlatformType.WebStorm, '2026.1.3'
            create IntelliJPlatformType.IntellijIdea, '2026.2.0.1'
            create IntelliJPlatformType.WebStorm, '2026.2.0.1'
        }
    }
}

tasks.register('verifyHandoff', JavaExec) {
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'dev.stateport.jetbrains.HandoffCheck'
}

tasks.named('build') { dependsOn 'verifyHandoff' }
