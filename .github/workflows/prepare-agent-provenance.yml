name: Prepare first-publish provenance
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed bootstrap version
        required: true
        type: string
      sha256:
        description: Reviewed tarball SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  attest:
    if: github.repository == 'StatePort-Dev/stateport-agent-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.17.0
      - run: npm run verify
      - name: Build exact public artifact and its keyless provenance without registry mutation
        run: |
          mkdir "$RUNNER_TEMP/stateport-provenance"
          npm pack ./bootstrap --ignore-scripts --pack-destination "$RUNNER_TEMP/stateport-provenance"
          NPM_TOOL_ROOT="$(npm root -g)/npm" node --input-type=module <<'JS'
          import{readFileSync,writeFileSync}from'node:fs';import{join}from'node:path';import{createHash}from'node:crypto';import{createRequire}from'node:module';import{execFileSync}from'node:child_process';
          const e=process.env,p=JSON.parse(readFileSync('bootstrap/package.json'));
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==e.GITHUB_SHA||p.name!=='stateport'||p.version!==e.EXPECTED_VERSION||!/[0-9]+\.[0-9]+\.[0-9]+/.test(p.version)||!/^[a-f0-9]{64}$/.test(e.EXPECTED_SHA256))throw Error('ATTEST_IDENTITY');
          const folder=join(e.RUNNER_TEMP,'stateport-provenance'),filename=`stateport-${p.version}.tgz`,bytes=readFileSync(join(folder,filename));if(createHash('sha256').update(bytes).digest('hex')!==e.EXPECTED_SHA256)throw Error('ATTEST_PACKAGE_CHANGED');
          const tool=createRequire(join(e.NPM_TOOL_ROOT,'package.json'));if(tool('./package.json').version!=='11.17.0')throw Error('ATTEST_TOOL_VERSION');
          const npa=tool('npm-package-arg'),{generateProvenance,verifyProvenance}=tool('./node_modules/libnpmpublish/lib/provenance.js');
          const subject={name:npa.toPurl(npa.resolve(p.name,p.version)),digest:{sha512:createHash('sha512').update(bytes).digest('hex')}};
          const bundle=await generateProvenance([subject],{}),path=join(folder,filename+'.sigstore');writeFileSync(path,JSON.stringify(bundle));await verifyProvenance(subject,path);
          writeFileSync(join(folder,'PREPARATION.json'),JSON.stringify({version:p.version,sourceCommit:e.GITHUB_SHA,sha256:e.EXPECTED_SHA256,provenanceVerified:true,published:false,registryWrites:false},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stateport-first-publish-${{ inputs.version }}
          path: ${{ runner.temp }}/stateport-provenance
          if-no-files-found: error
